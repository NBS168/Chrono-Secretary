<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINE 貼圖批次處理器（網頁版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <header class="bg-white p-6 rounded-xl shadow-sm border">
      <h1 class="text-2xl font-bold">LINE 貼圖批次處理器（網頁版）</h1>
      <p class="text-sm text-slate-600 mt-2">支援一次上傳多張圖，處理流程：去白邊 → 去背景（白色轉透明）→ 等比例置中到 370×320 → 檔名改成「前綴 + 圖中文字」。</p>
    </header>

    <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">檔名前綴（上傳文字）</label>
        <input id="prefix" type="text" placeholder="例如：角色A_" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-400 outline-none" />
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <label class="block">
          <span class="block text-sm font-medium mb-1">上傳圖片（可多選）</span>
          <input id="fileInput" type="file" accept="image/*" multiple class="block w-full text-sm" />
        </label>
        <label class="block">
          <span class="block text-sm font-medium mb-1">或上傳整個資料夾（Chrome/Edge）</span>
          <input id="folderInput" type="file" accept="image/*" webkitdirectory directory multiple class="block w-full text-sm" />
        </label>
      </div>

      <div class="grid md:grid-cols-3 gap-4">
        <label class="text-sm">
          <span class="block mb-1">白底去背閾值（0-255）</span>
          <input id="threshold" type="number" value="245" min="0" max="255" class="w-full border rounded-lg p-2" />
        </label>
        <label class="text-sm flex items-center gap-2 mt-6">
          <input id="useOCR" type="checkbox" checked />
          <span>啟用 OCR（中文+英文）</span>
        </label>
      </div>

      <div class="flex flex-wrap gap-3">
        <button id="processBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg">開始處理</button>
        <button id="zipBtn" disabled class="bg-emerald-600 disabled:bg-emerald-300 text-white px-5 py-2 rounded-lg">下載全部 ZIP</button>
      </div>

      <p id="status" class="text-sm text-slate-600">尚未開始。</p>
    </section>

    <section class="bg-white p-6 rounded-xl shadow-sm border">
      <h2 class="font-bold mb-3">處理結果</h2>
      <div class="overflow-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="border-b bg-slate-50">
              <th class="text-left p-2">原始檔名</th>
              <th class="text-left p-2">新檔名</th>
              <th class="text-left p-2">預覽</th>
              <th class="text-left p-2">下載</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const TARGET_W = 370;
    const TARGET_H = 320;
    const outputFiles = [];

    const fileInput = document.getElementById('fileInput');
    const folderInput = document.getElementById('folderInput');
    const prefixInput = document.getElementById('prefix');
    const thresholdInput = document.getElementById('threshold');
    const useOCRInput = document.getElementById('useOCR');
    const processBtn = document.getElementById('processBtn');
    const zipBtn = document.getElementById('zipBtn');
    const statusEl = document.getElementById('status');
    const resultBody = document.getElementById('resultBody');

    function sanitizeFilename(text) {
      return text
        .trim()
        .replace(/\s+/g, '_')
        .replace(/[^\w\-\u4e00-\u9fff]/g, '')
        .slice(0, 60);
    }

    async function fileToImageData(file) {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);
      return ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function trimWhiteBorder(imageData, threshold = 245) {
      const { data, width, height } = imageData;
      let left = width, top = height, right = -1, bottom = -1;

      const isWhite = (r, g, b, a) => a === 0 || (r >= threshold && g >= threshold && b >= threshold);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
          if (!isWhite(r, g, b, a)) {
            left = Math.min(left, x);
            top = Math.min(top, y);
            right = Math.max(right, x);
            bottom = Math.max(bottom, y);
          }
        }
      }

      if (right === -1) return imageData;

      const tw = right - left + 1;
      const th = bottom - top + 1;
      const out = new ImageData(tw, th);

      for (let y = 0; y < th; y++) {
        for (let x = 0; x < tw; x++) {
          const srcIdx = ((y + top) * width + (x + left)) * 4;
          const dstIdx = (y * tw + x) * 4;
          out.data[dstIdx] = data[srcIdx];
          out.data[dstIdx + 1] = data[srcIdx + 1];
          out.data[dstIdx + 2] = data[srcIdx + 2];
          out.data[dstIdx + 3] = data[srcIdx + 3];
        }
      }
      return out;
    }

    function removeWhiteBackground(imageData, threshold = 245) {
      const out = new ImageData(new Uint8ClampedArray(imageData.data), imageData.width, imageData.height);
      for (let i = 0; i < out.data.length; i += 4) {
        const r = out.data[i], g = out.data[i + 1], b = out.data[i + 2];
        if (r >= threshold && g >= threshold && b >= threshold) {
          out.data[i + 3] = 0;
        }
      }
      return out;
    }

    async function ocrTextFromImageData(imageData) {
      const canvas = document.createElement('canvas');
      canvas.width = imageData.width;
      canvas.height = imageData.height;
      canvas.getContext('2d').putImageData(imageData, 0, 0);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      const result = await Tesseract.recognize(blob, 'chi_tra+eng');
      return result.data.text || '';
    }

    async function fitToLineStickerBlob(imageData) {
      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = imageData.width;
      srcCanvas.height = imageData.height;
      srcCanvas.getContext('2d').putImageData(imageData, 0, 0);

      const canvas = document.createElement('canvas');
      canvas.width = TARGET_W;
      canvas.height = TARGET_H;
      const ctx = canvas.getContext('2d');

      const scale = Math.min(TARGET_W / imageData.width, TARGET_H / imageData.height);
      const nw = Math.max(1, Math.floor(imageData.width * scale));
      const nh = Math.max(1, Math.floor(imageData.height * scale));
      const x = Math.floor((TARGET_W - nw) / 2);
      const y = Math.floor((TARGET_H - nh) / 2);

      ctx.clearRect(0, 0, TARGET_W, TARGET_H);
      ctx.drawImage(srcCanvas, 0, 0, imageData.width, imageData.height, x, y, nw, nh);

      return await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    }

    function pickFiles() {
      const files = [...fileInput.files, ...folderInput.files].filter(f => f.type.startsWith('image/'));
      const dedup = new Map(files.map(f => [`${f.name}-${f.size}-${f.lastModified}`, f]));
      return [...dedup.values()];
    }

    function uniqueName(baseName, used) {
      if (!used.has(baseName)) {
        used.add(baseName);
        return baseName;
      }
      let i = 2;
      while (used.has(`${baseName}_${i}`)) i++;
      const name = `${baseName}_${i}`;
      used.add(name);
      return name;
    }

    function addResultRow(originalName, newName, blob) {
      const tr = document.createElement('tr');
      tr.className = 'border-b';

      const previewUrl = URL.createObjectURL(blob);
      const td1 = `<td class="p-2">${originalName}</td>`;
      const td2 = `<td class="p-2">${newName}.png</td>`;
      const td3 = `<td class="p-2"><img src="${previewUrl}" class="h-20 w-auto border rounded" /></td>`;
      const td4 = `<td class="p-2"><a href="${previewUrl}" download="${newName}.png" class="text-indigo-600 underline">下載</a></td>`;

      tr.innerHTML = td1 + td2 + td3 + td4;
      resultBody.appendChild(tr);
    }

    processBtn.addEventListener('click', async () => {
      const files = pickFiles();
      const prefix = sanitizeFilename(prefixInput.value || '');
      const threshold = Number(thresholdInput.value || 245);
      const useOCR = useOCRInput.checked;

      if (!files.length) {
        alert('請先上傳至少一張圖片。');
        return;
      }

      processBtn.disabled = true;
      zipBtn.disabled = true;
      outputFiles.length = 0;
      resultBody.innerHTML = '';
      statusEl.textContent = `開始處理，共 ${files.length} 張...`;

      const usedNames = new Set();

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusEl.textContent = `處理中 (${i + 1}/${files.length})：${file.name}`;

        try {
          const raw = await fileToImageData(file);
          const trimmed = trimWhiteBorder(raw, threshold);
          const noBg = removeWhiteBackground(trimmed, threshold);

          let ocrText = '';
          if (useOCR) {
            ocrText = sanitizeFilename(await ocrTextFromImageData(trimmed));
          }
          if (!ocrText) ocrText = `image_${String(i + 1).padStart(3, '0')}`;

          const finalName = uniqueName(sanitizeFilename(`${prefix}${ocrText}`) || `image_${String(i + 1).padStart(3, '0')}`, usedNames);
          const pngBlob = await fitToLineStickerBlob(noBg);

          outputFiles.push({ name: `${finalName}.png`, blob: pngBlob });
          addResultRow(file.name, finalName, pngBlob);
        } catch (err) {
          const tr = document.createElement('tr');
          tr.className = 'border-b bg-rose-50';
          tr.innerHTML = `<td class="p-2">${file.name}</td><td class="p-2 text-rose-700" colspan="3">處理失敗：${err.message || err}</td>`;
          resultBody.appendChild(tr);
        }
      }

      statusEl.textContent = `完成！成功輸出 ${outputFiles.length} 張 PNG。`;
      zipBtn.disabled = outputFiles.length === 0;
      processBtn.disabled = false;
    });

    zipBtn.addEventListener('click', async () => {
      if (!outputFiles.length) return;
      statusEl.textContent = '正在打包 ZIP...';
      const zip = new JSZip();
      outputFiles.forEach(f => zip.file(f.name, f.blob));
      const blob = await zip.generateAsync({ type: 'blob' });

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'line_stickers.zip';
      a.click();
      statusEl.textContent = 'ZIP 下載完成。';
    });
  </script>
</body>
</html>
